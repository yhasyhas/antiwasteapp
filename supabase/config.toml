# Configuration du CLI Supabase pour le projet lié (iqzjonmjlscuckdmiehk).
# Seuls les réglages utilisés sont écrits ; le reste garde les valeurs par défaut du CLI.
project_id = "antiwasteapp"

# La passerelle ne vérifie pas le jeton : chaque fonction vérifie l'utilisateur elle-même
# (supabase/functions/_shared/auth.ts), ce qui fonctionne aussi avec les nouvelles clés d'API,
# qui ne sont pas des JWT.
[functions.analyze-image]
verify_jwt = false

[functions.generate-recipes]
verify_jwt = false

[functions.generate-recipe-image]
verify_jwt = false

# Appelée par pg_cron avec le secret CRON_SECRET (en-tête x-cron-secret), jamais par l'app
[functions.daily-digest]
verify_jwt = false

# Fiche aliment : chaque fonction vérifie l'utilisateur elle-même (ou la clé secrète pour le pré-remplissage)
[functions.food-fact]
verify_jwt = false

[functions.translate-recipe]
verify_jwt = false

# Évaluation des recettes (phase 9) : copie de generate-recipes réservée aux essais, appelée seulement par
# scripts/recipe-eval avec la clé secrète (en-tête x-eval-key), jamais par l'app
[functions.generate-recipes-eval]
verify_jwt = false

# Avis (« Donner mon avis ») et recettes signalées : la fonction vérifie l'utilisateur elle-même
[functions.send-feedback]
verify_jwt = false
